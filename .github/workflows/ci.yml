name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web-kit:
    name: Tokens, contrast and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The gate this repository exists for. Recomputes every generated artifact from
      # tokens.json and fails if a checked-in copy differs, then asserts every semantic role
      # pair, every tag swatch and every categorical series against WCAG AA.
      #
      # Only the artifacts this repository owns are checked here. The copies in Identity,
      # Infra and Mobile live in other repositories and are verified by their own CI, which
      # clones this one alongside its checkout; see the "Design tokens in sync" step there.
      - name: Tokens in sync and contrast gate
        run: npm run check --workspace @prabhixtechnologies/brand

      - name: Typecheck
        run: npm run typecheck

      # Every workspace that has tests, rather than one named package. @prabhixtechnologies/ui gained a
      # suite with this change and a named list is how the next one gets left out.
      - name: Test
        run: npm test

  visuals:
    name: Visual invariants
    runs-on: ubuntu-latest
    # A separate job because it needs a browser download, and because it answers a different
    # question: the job above checks that the token values are right, this one checks that they
    # reach paint. The single-colour bug satisfied the first and failed the second.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only. These tests compare renders against each other rather than against
      # stored bytes, so a second engine would triple the runtime and answer the same question.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: gallery

      # No stored baselines: the assertions are that the five brands do not render alike, that
      # dark is not light, and that a [data-brand] below the root takes its own accent. Nothing
      # here depends on the platform's fonts, so it is the same answer on any machine.
      - name: Visual invariants
        run: npm run test:visual
        working-directory: gallery

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: gallery/test-results/
          retention-days: 7