name: Publish

# Publishes @prabhix/brand and @prabhix/ui to GitHub Packages.
#
# The seven consuming repositories currently clone this one beside their own checkout at a pinned
# WEBKIT_REF and compile the sources. That works, and it costs a clone on every CI run plus a pin
# that has to be bumped by hand in four workflow files every time anything here changes -- which
# has already gone wrong: the pins went stale, and the apps were tested against a web-kit that was
# not the one being shipped.
#
# A version range fixes the pin problem properly, because Dependabot can move it. GitHub Packages
# rather than S3 for the same reason: a tarball at a URL is still a hand-edited pin in seven
# repositories, so it would move the chore rather than remove it. Bandwidth from Actions to GitHub
# Packages is not billed, which matters here -- these repositories are on metered billing.
#
# Releasing is deliberately manual and tag-driven. Publishing on every push to main would make the
# version meaningless and give consumers no way to stay still while something settles.
#
# BLOCKED: GitHub Packages resolves an npm scope to a GitHub owner of the same name. These
# packages are scoped `@prabhix` and this account is `prabhixtechnologies`, so every publish
# returns `403 Permission not_found: owner not found` -- for the scope, not for the token. The
# first tagged run failed all three this way, and the step reported success because its error
# handling assumed any failure meant the version already existed.
#
# There is no registry setting that fixes this. The options are to rename the scope to
# `@prabhixtechnologies` (about 100 reference lines across seven repositories, and free), or to
# use a registry that allows an arbitrary scope -- AWS CodeArtifact keeps the `@prabhix` name but
# `codeartifact:*` is denied to the prabhix IAM user, so it needs setting up first.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@prabhix"

      - run: npm ci

      # The gates run here as well as in ci.yml. A tag can point at a commit that never went
      # through a pull request, and a published version cannot be taken back -- npm allows
      # unpublish only within 72 hours, and a consumer that has already resolved it keeps the
      # bad copy in its lockfile regardless.
      - name: Gates
        run: npm run check --workspace @prabhix/brand

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      # The generator writes into sibling repositories when they are present and into this one
      # when they are not. On a runner there are no siblings, so a dirty tree here means the
      # committed CSS does not match tokens.json -- publishing it would ship tokens that no
      # consumer could reproduce.
      - name: Generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ from what is committed. Run 'npm run build --workspace @prabhix/brand' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Pack
        run: |
          for pkg in brand ui oidc-client; do
            echo "--- @prabhix/$pkg ---"
            npm pack --workspace "@prabhix/$pkg" --dry-run
          done

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-publishing an existing version is the one tolerable failure, and it has to be
          # matched on rather than assumed. An earlier version of this step ended in
          # `|| echo "::warning::...most likely exists already"`, which treated *every* failure
          # as that case: all three packages failed with 403 "owner not found", the step printed
          # a reassuring and wrong explanation, and the run went green having published nothing.
          # A publish step that cannot fail is worse than no publish step.
          set -uo pipefail
          failed=0
          for pkg in brand ui oidc-client; do
            out="$(npm publish --workspace "@prabhix/$pkg" --access restricted 2>&1)" && continue
            echo "$out"
            if grep -qE 'EPUBLISHCONFLICT|cannot publish over|previously published' <<<"$out"; then
              echo "::notice::@prabhix/$pkg is already published at this version; nothing to do."
            else
              echo "::error::@prabhix/$pkg failed to publish for a reason other than already existing."
              failed=1
            fi
          done
          exit "$failed"
