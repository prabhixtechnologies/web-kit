name: Publish

# Publishes @prabhixtechnologies/brand, /ui and /oidc-client to GitHub Packages.
# Live at brand 1.1.1, ui 1.0.1, oidc-client 1.0.2.
#
# All four web apps consume them by version range. They used to clone this repository beside their
# own checkout at a pinned WEBKIT_REF and compile the sources, which cost a clone on every CI run
# plus a pin bumped by hand in four workflow files -- and had already gone wrong, the pins going
# stale so the apps were tested against a web-kit that was not the one being shipped.
#
# A version range fixed the pin problem properly, because Dependabot can move it. GitHub Packages
# rather than S3 for the same reason: a tarball at a URL is still a hand-edited pin in several
# repositories, so it would have moved the chore rather than removed it. Bandwidth from Actions to
# GitHub Packages is not billed, which matters here -- these repositories are on metered billing.
#
# Identity, Infra and Mobile still clone this repository, for the token-sync and colour gates
# only. They have no npm dependency on it.
#
# Releasing is deliberately manual and tag-driven. Publishing on every push to main would make the
# version meaningless and give consumers no way to stay still while something settles.
#
# Why the scope is `@prabhixtechnologies` and not the shorter `@prabhix`: GitHub Packages resolves
# an npm scope to a GitHub owner of the same name. Under `@prabhix` every publish returned
# `403 Permission not_found: owner not found` -- the scope was missing, not the token -- and no
# registry setting changes that. The scope has to equal the account. Renaming it cost 230
# references across eight repositories; the alternative was a registry that allows an arbitrary
# scope, and `codeartifact:*` is denied to the prabhix IAM user.
#
# Do not shorten it back.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and inspect without publishing"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@prabhixtechnologies"

      - run: npm ci

      # The gates run here as well as in ci.yml. A tag can point at a commit that never went
      # through a pull request, and a published version cannot be taken back -- npm allows
      # unpublish only within 72 hours, and a consumer that has already resolved it keeps the
      # bad copy in its lockfile regardless.
      - name: Gates
        run: npm run check --workspace @prabhixtechnologies/brand

      - name: Test
        run: npm test --workspaces --if-present

      - name: Build
        run: npm run build --workspaces --if-present

      # The generator writes into sibling repositories when they are present and into this one
      # when they are not. On a runner there are no siblings, so a dirty tree here means the
      # committed CSS does not match tokens.json -- publishing it would ship tokens that no
      # consumer could reproduce.
      - name: Generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files differ from what is committed. Run 'npm run build --workspace @prabhixtechnologies/brand' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Pack
        run: |
          for pkg in brand ui oidc-client; do
            echo "--- @prabhixtechnologies/$pkg ---"
            npm pack --workspace "@prabhixtechnologies/$pkg" --dry-run
          done

      - name: Publish
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-publishing an existing version is the one tolerable failure, and it has to be
          # matched on rather than assumed. An earlier version of this step ended in
          # `|| echo "::warning::...most likely exists already"`, which treated *every* failure
          # as that case: all three packages failed with 403 "owner not found", the step printed
          # a reassuring and wrong explanation, and the run went green having published nothing.
          # A publish step that cannot fail is worse than no publish step.
          #
          # Match the machine-readable codes first. The prose was tried on its own and got this
          # wrong a second time: npm writes "Cannot publish over existing version" with a capital
          # C, a case-sensitive grep missed it, and a successful no-op re-publish was reported as
          # a failure. Hence E409/EPUBLISHCONFLICT, and -i on the prose fallback.
          set -uo pipefail
          failed=0
          for pkg in brand ui oidc-client; do
            out="$(npm publish --workspace "@prabhixtechnologies/$pkg" --access restricted 2>&1)" && continue
            echo "$out"
            if grep -qiE 'E409|409 Conflict|EPUBLISHCONFLICT|cannot publish over|previously published' <<<"$out"; then
              echo "::notice::@prabhixtechnologies/$pkg is already published at this version; nothing to do."
            else
              echo "::error::@prabhixtechnologies/$pkg failed to publish for a reason other than already existing."
              failed=1
            fi
          done
          exit "$failed"
