name: Visual baselines

# Generates the committed pixel baselines and pushes them.
#
# Manual, and it has to be: a baseline is a decision that the current rendering is the one worth
# keeping, which is not something a push to main can assert on its own. Run this after an
# intentional visual change, then read the diff in the resulting commit before trusting it.
#
# It runs here rather than on a developer machine because a baseline is bytes from one
# particular renderer. Linux and Windows disagree about text rasterisation and scrollbar width,
# so a set generated on Windows fails on every CI run afterwards, and the usual response to that
# is to raise the tolerance until it stops complaining - at which point the baselines no longer
# detect anything.
#
# The invariant tests in CI need none of this. They compare renders from the same run against
# each other and are the ones that catch a brand not being applied.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "What visual change these baselines record"
        required: true
        type: string

permissions:
  contents: write

jobs:
  baselines:
    name: Regenerate and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: gallery

      # VR_BASELINE=1 is what adds the baseline project at all; without it the config only
      # registers the invariants. --update-snapshots writes the PNGs rather than comparing.
      - name: Write baselines
        env:
          VR_BASELINE: "1"
        run: npx playwright test --project baseline --update-snapshots
        working-directory: gallery

      # Comparing immediately afterwards is the part that makes this trustworthy: it proves the
      # set that was just written actually passes, rather than leaving a broken baseline in main
      # for the next push to discover.
      - name: Verify the new baselines pass
        env:
          VR_BASELINE: "1"
        run: npx playwright test --project baseline
        working-directory: gallery

      - name: Commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain gallery/tests)" ]; then
            echo "::notice::Rendering is unchanged; there are no new baselines to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/tests
          git commit -m "Update visual baselines

          ${{ inputs.reason }}

          Generated by the Visual baselines workflow on ubuntu-latest, and verified by a
          comparison run against the newly written set before committing."
          git push
